  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--body);color:var(--ink);font-weight:500;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    background:radial-gradient(rgba(29,21,70,.07) 2.5px, transparent 3px) 0 0/24px 24px, var(--cream);min-height:100vh;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;cursor:pointer;}
  .kp{word-break:keep-all;overflow-wrap:anywhere;}

  .top{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:16px 20px 0;}
  .top-logo{display:block;width:84px;height:40px;background:var(--logo) left center/contain no-repeat;}
  .top-back{font-weight:800;font-size:.82rem;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 var(--ink);}
  .top-back:hover{background:var(--yellow);}

  .wrap{max-width:560px;margin:0 auto;padding:0 20px 64px;}
  .screen{display:none;animation:pop .45s cubic-bezier(.34,1.56,.64,1);}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}

  .pill{display:inline-block;font-weight:800;font-size:.85rem;background:var(--yellow);border:2.5px solid var(--ink);
    border-radius:999px;padding:3px 16px;box-shadow:0 3px 0 var(--ink);transform:rotate(-3deg);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:1.05rem;
    background:var(--yellow);color:var(--ink);border:var(--bd);border-radius:999px;padding:15px 34px;box-shadow:0 6px 0 var(--ink);
    transition:transform .15s,box-shadow .15s;}
  .btn:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--ink);}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink);}
  .btn.ghost{background:#fff;}
  .btn.dark{background:var(--ink);color:#fff;box-shadow:0 6px 0 rgba(29,21,70,.3);}
  .btn svg{width:18px;height:18px;fill:currentColor;}

  /* ---------- HERO ---------- */
  #hero{text-align:center;padding-top:28px;}
  .icon-fan{position:relative;height:150px;margin:26px auto 22px;max-width:420px;}
  .icon-fan img{position:absolute;top:50%;left:50%;width:78px;height:78px;border-radius:24%;border:3px solid var(--ink);
    box-shadow:0 5px 0 var(--ink);transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--r));
    animation:bob 4s ease-in-out infinite;animation-delay:var(--d);}
  @keyframes bob{0%,100%{margin-top:0;}50%{margin-top:-10px;}}
  .hero-title{font-family:var(--display);font-weight:400;font-size:clamp(1.85rem,7vw,2.6rem);line-height:1.4;margin:16px 0 14px;}
  .hero-title em{font-style:normal;background:linear-gradient(transparent 58%, var(--yellow) 58%, var(--yellow) 94%, transparent 94%);padding:0 .08em;}
  .hero-sub{font-weight:700;color:var(--ink-soft);margin:0 0 30px;}
  .hero-meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px;font-weight:800;font-size:.82rem;}
  .hero-meta span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;}

  /* ---------- QUIZ ---------- */
  #quiz{padding-top:30px;}
  .q-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .q-num{font-family:var(--latin);font-weight:800;font-size:1.1rem;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;white-space:nowrap;}
  .bar{flex:1;height:14px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--rainbow);border-right:2.5px solid var(--ink);transition:width .4s cubic-bezier(.34,1.56,.64,1);}
  .q-card{background:#fff;border:var(--bd);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:28px 22px 22px;margin-top:22px;}
  .q-text{font-family:var(--display);font-weight:400;font-size:clamp(1.25rem,5vw,1.55rem);line-height:1.55;margin:0 0 22px;text-align:center;}
  .options{display:flex;flex-direction:column;gap:12px;}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--cream);border:2.5px solid var(--ink);
    border-radius:18px;padding:13px 16px;font-weight:700;font-size:.98rem;line-height:1.55;box-shadow:0 4px 0 var(--ink);
    transition:transform .12s,box-shadow .12s,background .12s;}
  .opt:hover{background:#fff3c4;transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
  .opt:active,.opt.picked{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--yellow);}
  .opt .k{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--latin);font-weight:800;
    background:#fff;border:2.5px solid var(--ink);}
  .q-back{display:block;margin:22px auto 0;background:none;border:0;font-weight:800;font-size:.88rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:4px;}
  .q-back[hidden]{display:none;}

  /* ---------- LOADING ---------- */
  #loading{text-align:center;padding-top:110px;}
  .spinner{width:90px;height:90px;margin:0 auto 22px;border-radius:50%;border:var(--bd);
    background:conic-gradient(var(--red),var(--orange),var(--yellow),var(--mint),var(--sky),var(--blue),var(--violet),var(--red));
    animation:spin 1s linear infinite;box-shadow:0 6px 0 var(--ink);}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading p{font-family:var(--display);font-size:1.2rem;margin:0;}

  /* ---------- RESULT ---------- */
  #result{padding-top:26px;text-align:center;}
  .r-card{position:relative;background:#fff;border:var(--bd);border-radius:30px;box-shadow:0 10px 0 var(--ink);overflow:hidden;margin-top:18px;}
  .r-top{background:radial-gradient(rgba(255,255,255,.55) 2.5px, transparent 3px) 0 0/20px 20px, var(--c);border-bottom:var(--bd);padding:26px 20px 22px;}
  .r-eyebrow{display:inline-block;font-weight:800;font-size:.85rem;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:2px 16px;}
  .r-type{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1.2;margin:12px 0 6px;text-shadow:4px 4px 0 #fff;}
  .r-catch{font-weight:800;font-size:1.05rem;margin:0;}
  .r-body{padding:22px 22px 26px;}
  .r-lead{font-weight:700;color:var(--ink-2);margin:0 0 22px;text-align:left;}
  .r-game-label{font-family:var(--latin);font-weight:800;font-size:.78rem;letter-spacing:.14em;color:var(--ink-soft);margin:0 0 12px;}
  .r-game{display:flex;align-items:center;gap:16px;text-align:left;background:var(--cream);border:2.5px solid var(--ink);border-radius:22px;padding:14px;margin-bottom:16px;}
  .r-game img{width:96px;height:96px;flex:0 0 auto;border-radius:24%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transform:rotate(-4deg);}
  .r-game h3{margin:0 0 4px;font-family:var(--latin);font-weight:800;font-size:1.2rem;line-height:1.25;}
  .r-game p{margin:0;word-break:keep-all;overflow-wrap:anywhere;font-size:.9rem;font-weight:700;color:var(--ink-soft);line-height:1.65;}
  .r-dl{width:100%;white-space:nowrap;padding-left:16px;padding-right:16px;}
  .r-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px;}
  .r-actions .btn{font-size:.95rem;padding:12px 22px;}

  .others{margin-top:44px;text-align:left;}
  .others h4{font-family:var(--display);font-weight:400;font-size:1.15rem;text-align:center;margin:0 0 16px;}
  .o-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .o-item{--c:#fff;display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:9px 10px;
    box-shadow:0 4px 0 var(--ink);transition:transform .15s,box-shadow .15s;}
  .o-item:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);background:var(--c);}
  .o-item img{width:46px;height:46px;flex:0 0 auto;border-radius:24%;border:2px solid var(--ink);}
  .o-item b{display:block;font-size:.88rem;line-height:1.3;}
  .o-item small{display:block;font-size:.7rem;font-weight:700;color:var(--ink-soft);line-height:1.35;}

  footer{text-align:center;font-size:.8rem;font-weight:700;color:var(--ink-soft);padding:20px 0 34px;}
  footer a{text-decoration:underline;text-underline-offset:3px;}

  @media (max-width:420px){
    .icon-fan img{width:64px;height:64px;}
    .r-game img{width:78px;height:78px;}
    .o-grid{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }
</style>
</head>

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0, behavior:'instant'});
}

/* hero icon fan */
(function(){
  const pos=[[-150,10,-14],[-75,-18,8],[0,4,-4],[75,-18,10],[150,10,-8]];
  const keys=["I","J","H","K","E"];
  const fan=$('iconFan');
  const scale = Math.min(1,(fan.clientWidth||360)/420);
  keys.forEach((k,i)=>{
    const img=document.createElement('img'); img.src=ICONS[k]; img.alt='';
    img.style.setProperty('--x',(pos[i][0]*scale)+'px'); img.style.setProperty('--y',pos[i][1]+'px');
    img.style.setProperty('--r',pos[i][2]+'deg'); img.style.setProperty('--d',(i*-.6)+'s');
    img.style.zIndex = i===2?3:(i%2?2:1);
    fan.appendChild(img);
  });
})();

/* ---------- flow ---------- */
let answers = [];
let current = 0;

function startQuiz(){ answers=[]; current=0; show('quiz'); renderQuestion(); }

function renderQuestion(){
  const q = questions[current];
  $('qNum').textContent = `Q${current+1} / ${questions.length}`;
  $('qBar').style.width = (current/questions.length*100)+'%';
  $('qText').textContent = q.text;
  $('backBtn').hidden = current===0;
  const wrap = $('qOptions'); wrap.innerHTML='';
  const opts = q.options.slice().sort(()=>Math.random()-0.5);
  opts.forEach((opt,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='opt';
    b.innerHTML=`<span class="k">${'ABCD'[i]}</span><span class="kp"></span>`;
    b.lastChild.textContent=opt.label;
    b.addEventListener('click',()=>{
      if(wrap.dataset.lock) return; wrap.dataset.lock='1';
      b.classList.add('picked');
      answers[current]=opt.type;
      setTimeout(()=>{
        delete wrap.dataset.lock;
        current++;
        if(current>=questions.length){ $('qBar').style.width='100%'; finish(); }
        else renderQuestion();
      },220);
    });
    wrap.appendChild(b);
  });
}

function finish(){
  show('loading');
  setTimeout(()=>showResult(pickWinner()),1100);
}

function pickWinner(){
  // 最多のタイプ。同点なら、後の質問で選んだタイプを優先
  const tally={}; answers.forEach(t=>tally[t]=(tally[t]||0)+1);
  let winner=null,max=0;
  answers.forEach(t=>{ if(tally[t]>=max){ max=tally[t]; winner=t; } });
  return winner;
}

function showResult(key){
  const r=results[key];
  $('rCard').style.setProperty('--c',r.color);
  $('rEyebrow').textContent='TYPE '+key;
  $('rType').textContent=r.type;
  $('rCatch').textContent=r.catch;
  $('rLead').textContent=r.lead;
  $('rIcon').src=ICONS[key]; $('rIcon').alt=r.game;
  $('rGameName').textContent=r.game;
  $('rGameDesc').textContent=r.desc;
  $('rGameLink').href=r.url;

  const Z=s=>s.replace(/\u200b/g,'');
  const text=Z(`AIRIS パーソナル診断の結果、わたしは【${r.type}】${r.catch}でした！ぴったりのゲームは『${r.game}』`);
  const url=location.href.split('#')[0].split('?')[0];
  $('shareBtn').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url)+'&hashtags='+encodeURIComponent('AIRIS診断,Cosmii');

  const list=$('otherList'); list.innerHTML='';
  ORDER.filter(k=>k!==key).forEach(k=>{
    const it=results[k];
    const a=document.createElement('a'); a.className='o-item'; a.href=it.url; a.target='_blank'; a.rel='noopener';
    a.style.setProperty('--c',it.color);
    a.innerHTML=`<img src="${ICONS[k]}" alt=""><span><b></b><small></small></span>`;
    a.querySelector('b').textContent=it.type;
    a.querySelector('small').textContent=it.game;
    list.appendChild(a);
  });
  show('result');
}

$('startBtn').addEventListener('click',startQuiz);
$('retryBtn').addEventListener('click',startQuiz);
$('backBtn').addEventListener('click',()=>{ if(current>0){ current--; answers.length=current; renderQuestion(); } });
